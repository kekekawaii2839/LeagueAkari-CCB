[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "league-akari-member-analysis-worker"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = []

[project.scripts]
member-analysis-worker = "member_analysis.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
