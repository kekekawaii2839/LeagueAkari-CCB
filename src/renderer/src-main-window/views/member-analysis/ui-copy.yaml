  predictionEntertainmentTitle: 娱乐预测
  predictionEntertainmentDisclaimer: 仅供娱乐，非校准获胜概率。
  predictionEntertainmentValue: 娱乐预测值
  predictionEntertainmentMethod: 使用本次所选成员的分路近期画像，适用指标按八组平衡汇总；指标方向来自同分路历史胜负关联并做收缩，资料不足时可借用本人其他分路的标准化画像。团队与分路娱乐值统一采用固定灵敏度展示（指数乘以 6 后映射），非校准胜率；原始指数贡献和支持量不变。结果不代表真实胜率，也不是因果或配合能力评分；相同画像可能得到相同结果。顶部复盘筛选及范围不用于预测。
  predictionEntertainmentSupportNote: 支持量为历史资料覆盖，不是验证样本；未回测或概率校准。
