  predictionEntertainmentTitle: Entertainment prediction
  predictionEntertainmentDisclaimer: For entertainment only; not a calibrated win probability.
  predictionEntertainmentValue: Entertainment prediction value
  predictionEntertainmentMethod: Uses recent selected member-by-role profiles, balancing applicable metrics across eight groups. Directions use shrunk same-role historical win/loss associations. Sparse history may borrow standardized profiles from the same member in other roles. Team and role entertainment values use the same fixed display sensitivity (index multiplied by 6 before mapping), not a calibrated win rate. Raw index contributions and support remain unchanged. This is not a true win rate or a causal or teamwork score. Identical profiles may receive identical results. Review-page filters and scope do not apply.
  predictionEntertainmentSupportNote: Support describes historical coverage, not validation samples. No backtest or probability calibration.
