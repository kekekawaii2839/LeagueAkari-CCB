  scroll: Jungle member comparison; horizontally scrollable
  empty: No jungle timeline data in the current sample.
  footer: Members follow settings order · — means no valid observation, not zero · valid denominators are shown nearby · scroll only the comparison region on narrow windows
  selectionGone: The selected member is no longer in this sample; details have been cleared.
  goldScale: 'Gold ±{{gold}} · XP ±{{xp}}; hollow: 10 min / filled: 15 min'
  gankScale: 'Lane ganks: 0–{{maximum}} events/game'
  objectiveScale: 'Dragons ±{{dragon}} · grubs ±{{grub}} · objective-fight net kills ±{{fight}}'
  methodOpening: Camp types and ownership are counted jointly. Each share uses all identified first camps, without renormalizing within own/enemy camps. Unknown ownership remains in full data; unidentified camps are excluded with counts shown. Blue/red sides use their own denominators.
  methodGank: Level 3 / 4 events may occur in the same game; rates are independent and do not sum to 100%. They use the existing timeline heuristic, not all actual attempts at those levels. The 3-minute snapshot requires level 3, 12–19 CS and champion damage or a kill involvement before 3 minutes; the 4-minute rule also requires increased damage or involvement at 3–4 minutes. Lane counts include jungle kills / assists in a lane within 14 minutes. Zone shares combine position observations and weighted kill involvement within 14 minutes (weight 5 each), divided by total weight.
  methodResources: First-dragon control uses determinable games; first allied dragon time uses available time records. Dragons, solo dragons, grubs, heralds and barons are per-game averages. Pre-15-minute dragon / grub / objective-fight differences use objective counts / net kills; each metric has a shared zero-centered scale.
  methodDevelopment: Gold differences at 10 / 15 minutes and XP at 15 minutes exclude missing snapshots. No XP-at-10 field exists. Gold and XP differences are relative to the enemy jungler, with shared zero-centered scales per metric. Hollow dots mark 10 minutes; filled dots mark 15 minutes. These are independent snapshots, not connected or a continuous trend. Farming, gold and objective damage per minute use totals / total minutes.
  uncertainty: Small samples do not establish stable conclusions. Wilson intervals apply only to win rate, not means, compositions or differences. Compare cautiously when samples differ.
