  selectionGone: 当前范围已没有所选成员，详情已清空。
  source: '来源：对局详情 / 时间线。不同指标的有效样本可能不同。'
  openingNote: 开野归属按归属可判定场次；首营地联合构成按营地可识别场次。归属未知的营地可展开查看。
  gankNote: 3 / 4 级可能同场发生，分别显示，不组成100%。分路抓人只计14分钟内参与的分路击杀 / 助攻，不代表所有尝试。
  objectivesNote: 首龙控制率按可判定场次；我方首龙时间按有时间记录的场次。场均资源与15分钟前差值不是同一口径。
  developmentNote: 10 / 15 分钟为两个独立快照，不是完整走势。经济差和经验差相对敌方打野；分均指标按总量 / 总时长。
  goldScale: '共同比较尺度：经济差 ±{{gold}} 金币；经验差 ±{{xp}} 经验；中线为零。10分钟为空心点，15分钟为实心点，不连线。'
  gankScale: '分路抓人共同尺度：0–{{maximum}} 次/场。活动区域：上半区 / 中路 / 下半区。'
  objectiveScale: '差值零线居中，共同尺度：小龙 ±{{dragon}} 条；巢虫 ±{{grub}} 只；资源团净击杀 ±{{fight}} 次。'
  methodOpening: 联合构成按营地与归属同时计数；每格比例统一除以首营地可识别场次，不在己方或敌方内部重新归一化。营地已识别但归属未知的保留在完整数据；营地本身未知的排除并显示未计入场次。蓝红拆分各用自己的分母。
  methodGank: 3 / 4 级发生率沿用已有时间线识别规则，不是全部该等级抓人尝试。3分钟快照需为3级、补刀12–19且有英雄伤害或前3分钟参与击杀；4分钟识别还需英雄伤害增长或3–4分钟参与击杀。活动区域按前14分钟位置观察加参与击杀权重计算（每次权重5），以累积权重为分母。
  methodResources: 小龙、独控小龙、巢虫、先锋、大龙为场均值。15分钟前小龙差、巢虫差、资源团净击杀分别使用条、只、次。
  methodDevelopment: 10 / 15分钟经济差与15分钟经验差排除缺失快照；现有数据没有10分钟经验差。分均补刀、经济和目标伤害按总量 / 总分钟数计算。
  uncertainty: 少量样本不作稳定结论。只有胜率展示Wilson区间，不为均值、构成或差值补造区间；样本不一致时谨慎比较。
