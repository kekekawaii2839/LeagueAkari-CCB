  campDetails: Full first-camp distribution (including unknown ownership)
  sideDetails: '{{side}} · full first-camp distribution'
  winRate: 'Win rate {{rate}}'
  interval: 'Wilson 95% interval {{low}}–{{high}}'
  lowSample: Small sample · compare cautiously
  regionSamples: 'Weight denominator {{weight}} · {{valid}}/{{total}} games with zone observations'
  minutes: '{{minutes}} total minutes'
  help: Definitions
  hideHelp: Hide definitions
  definitions: Definitions and limitations
  scroll: Jungle member comparison; horizontally scrollable
  empty: No jungle timeline data in the current sample.
  footer: Members follow settings order · — means no valid observation, not zero · valid denominators are shown nearby · scroll only the comparison region on narrow windows
  selectionGone: The selected member is no longer in this sample; details have been cleared.
  source: 'Source: match details / timeline. Valid samples may differ by metric.'
  openingNote: Ownership rates use camps with known ownership; joint camp shares use all identified camps. Expand full data for unknown ownership camp types.
  gankNote: Level 3 / 4 events may occur in the same game and do not sum to 100%. Lane counts include jungle kills / assists in a lane within 14 minutes, not all attempts.
  objectivesNote: First-dragon control uses determinable games; first allied dragon time uses available time records. Objective averages and pre-15-minute differences have different definitions.
  developmentNote: 10 / 15 minutes are two snapshots, not a continuous trend. Gold and XP differences are relative to the enemy jungler; per-minute metrics use totals / total minutes.
  goldScale: 'Shared scale: gold ±{{gold}}; XP ±{{xp}}; center is zero. Hollow dots: 10 minutes; filled dots: 15 minutes; not connected.'
  gankScale: 'Shared lane-gank scale: 0–{{maximum}} events/game. Zones: upper / middle / lower.'
  objectiveScale: 'Zero-centered shared scales: dragons ±{{dragon}}; grubs ±{{grub}}; objective-fight net kills ±{{fight}}.'
  methodOpening: Camp types and ownership are counted jointly. Each share uses all identified first camps, without renormalizing within own/enemy camps. Unknown ownership remains in full data; unidentified camps are excluded with counts shown. Blue/red sides use their own denominators.
  methodGank: Level 3 / 4 uses the existing timeline heuristic, not all actual attempts at those levels. The 3-minute snapshot requires level 3, 12–19 CS and champion damage or a kill involvement before 3 minutes; the 4-minute rule also requires increased damage or involvement at 3–4 minutes. Zone shares combine position observations and weighted kill involvement within 14 minutes (weight 5 each), divided by total weight.
  methodResources: Dragons, solo dragons, grubs, heralds and barons are per-game averages. Pre-15-minute dragon / grub / objective-fight differences use objective counts / net kills.
  methodDevelopment: Gold differences at 10 / 15 minutes and XP at 15 minutes exclude missing snapshots. No XP-at-10 field exists. Farming, gold and objective damage per minute use totals / total minutes.
  uncertainty: Small samples do not establish stable conclusions. Wilson intervals apply only to win rate, not means, compositions or differences. Compare cautiously when samples differ.
