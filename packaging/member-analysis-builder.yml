# Feature-owned overlay. Keep the upstream base electron-builder.yml separate.
extends: electron-builder.yml
appId: com.ccb.leagueakari
productName: League Akari CCB
extraMetadata:
  productName: League Akari CCB
artifactName: ${productName}-${version}-${arch}.${ext}
directories:
  output: .phase7-package
files:
  # Positive roots prevent local recovery archives, legacy data and earlier packages from entering a candidate.
  # electron-builder collects production node_modules separately.
  - out/**
  - resources/**
  - package.json
  - LICENSE
  - '!{.env,.env.*}'
  - '!logs{,/**}'
  - '!resources/member-analysis{,/**}'
  - '!packaging{,/**}'
  - '!packages{,/**}'
  - '!scripts{,/**}'
  - '!.github{,/**}'
  - '!.yarn{,/**}'
  - '!{.gitmodules,.yarnrc.yml,.gitattributes,.gitignore}'
  - '!python{,/**}'
  - '!**/.cache{,/**}'
  - '!**/*.map'
  - '!**/tests{,/**}'
  - '!**/*.{test,spec}.{js,ts,mjs,cjs}'
extraResources:
  - from: resources/member-analysis
    to: member-analysis
    filter:
      - '**/*'
win:
  executableName: LeagueAkariCCB
