name: Sync Official Upstream

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/upstream-sync.yml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-dev
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  sync:
    name: Merge verified upstream/dev
    runs-on: windows-2022
    steps:
      # Repository prerequisite: configure a fine-grained credential with contents:read
      # for the private akari-prediction-lab repository. The default GITHUB_TOKEN
      # cannot read another private repository. Never fall back to unpinned sources.
      - name: Require authorized private Lab read access
        shell: pwsh
        env:
          LAB_READ_TOKEN: ${{ secrets.PREDICTION_LAB_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LAB_READ_TOKEN)) {
            throw "Missing PREDICTION_LAB_READ_TOKEN prerequisite: private Lab contents read access required"
          }

      - name: Check out the CCB development branch
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch official upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/Hanxven/LeagueAkari.git
          git fetch --no-tags upstream dev

      - name: Stop when already current
        id: freshness
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CCB dev already contains upstream/dev"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge on an isolated verification branch
        if: steps.freshness.outputs.changed == 'true'
        shell: bash
        run: |
          upstream_sha="$(git rev-parse upstream/dev)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "automation/upstream-${upstream_sha:0:12}"
          git merge --no-ff --no-commit upstream/dev
          node -e "const fs=require('node:fs');const p='docs/fork/patch-manifest.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.upstreamBaseline=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" "$upstream_sha"

      - name: Resolve the fixed Lab gitlink
        if: steps.freshness.outputs.changed == 'true'
        id: lab-pin
        shell: pwsh
        run: |
          $entry = @(git ls-files --stage -- packages/prediction-lab)
          if ($LASTEXITCODE -ne 0 -or $entry.Count -ne 1 -or [string]$entry[0] -notmatch '^160000 ([a-f0-9]{40}) 0\tpackages/prediction-lab$') {
            throw "A resolved fixed Prediction Lab gitlink is required"
          }
          $sha = $Matches[1]
          # The merged .gitmodules file must never choose where the private read
          # credential is sent. Checkout below also uses this fixed repository.
          $labPath = git config --file .gitmodules --get submodule.prediction-lab.path
          if ($LASTEXITCODE -ne 0 -or $labPath -ne 'packages/prediction-lab') {
            throw "Prediction Lab path differs from the authorized fixed source"
          }
          $labUrl = git config --file .gitmodules --get submodule.prediction-lab.url
          if ($LASTEXITCODE -ne 0 -or $labUrl -ne 'https://github.com/kekekawaii2839/akari-prediction-lab.git') {
            throw "Prediction Lab URL differs from the authorized fixed source"
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Initialize private Lab at the fixed gitlink
        if: steps.freshness.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: kekekawaii2839/akari-prediction-lab
          path: packages/prediction-lab
          ref: ${{ steps.lab-pin.outputs.sha }}
          token: ${{ secrets.PREDICTION_LAB_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Require pinned and clean Lab before dependency or runtime gates
        if: steps.freshness.outputs.changed == 'true'
        run: node scripts/checks/check-prediction-lab-submodule.mjs --require-pinned

      - name: Verify exact staged and working-tree privacy candidates
        if: steps.freshness.outputs.changed == 'true'
        run: node scripts/checks/check-member-analysis-data-leaks.mjs

      - name: Set up Node
        if: steps.freshness.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        if: steps.freshness.outputs.changed == 'true'
        run: corepack yarn install --immutable

      - name: Verify fork patch surface
        if: steps.freshness.outputs.changed == 'true'
        run: node scripts/check-patch-surface.mjs --manifest docs/fork/patch-manifest.json

      - name: Run tests and production build
        if: steps.freshness.outputs.changed == 'true'
        run: |
          corepack yarn test --maxWorkers=2
          corepack yarn build

      - name: Build and scan the CCB Windows package
        if: steps.freshness.outputs.changed == 'true'
        shell: pwsh
        run: |
          corepack yarn build:ccb:win
          node packaging/scan-packaged-artifact.mjs .phase7-package/win-unpacked

      - name: Integrate verified upstream into dev
        if: steps.freshness.outputs.changed == 'true'
        shell: bash
        run: |
          upstream_sha="$(git rev-parse upstream/dev)"
          git add docs/fork/patch-manifest.json
          git commit -m "chore(sync): merge official upstream ${upstream_sha:0:12}"
          git push origin HEAD:dev
